name: sdk

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: stable
      - name: Install dependencies
        run: |
          forge install foundry-rs/forge-std@v1.9.4 --no-git
          forge install OpenZeppelin/openzeppelin-contracts@v5.1.0 --no-git
      - name: Build
        run: forge build
      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: forge-out
          path: out
          retention-days: 1

  typescript:
    needs: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: stable
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: forge-out
          path: out
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/ts/package-lock.json
      - name: Install
        working-directory: sdk/ts
        run: npm ci
      - name: ABIs match contracts
        working-directory: sdk/ts
        run: |
          npm run abi:sync
          git diff --exit-code -- src/abis
      - name: Build and unit test
        working-directory: sdk/ts
        run: |
          npm run build
          npm test
      - name: Local deploy
        run: |
          forge install foundry-rs/forge-std@v1.9.4 --no-git
          forge install OpenZeppelin/openzeppelin-contracts@v5.1.0 --no-git
          anvil --port 8545 --silent &
          sleep 2
          PRIVATE_KEY=0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80 \
          DEPLOY_JSON_PATH=deployments/v2-local-ts.json \
          forge script script/v2/DeployLocal.s.sol --rpc-url http://127.0.0.1:8545 --broadcast
      - name: End-to-end
        working-directory: sdk/ts
        run: npm run e2e

  python:
    needs: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: stable
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: forge-out
          path: out
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: sdk/python
        run: pip install -e '.[dev]'
      - name: ABIs match contracts
        working-directory: sdk/python
        run: |
          python scripts/sync_abis.py
          git diff --exit-code -- nexusweb3/abis
      - name: Unit test
        working-directory: sdk/python
        run: pytest -q
      - name: Local deploy
        run: |
          forge install foundry-rs/forge-std@v1.9.4 --no-git
          forge install OpenZeppelin/openzeppelin-contracts@v5.1.0 --no-git
          anvil --port 8546 --silent &
          sleep 2
          PRIVATE_KEY=0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80 \
          DEPLOY_JSON_PATH=deployments/v2-local-py.json \
          forge script script/v2/DeployLocal.s.sol --rpc-url http://127.0.0.1:8546 --broadcast
      - name: End-to-end
        working-directory: sdk/python
        run: python scripts/e2e.py
