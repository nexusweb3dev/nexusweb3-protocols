[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexusweb3"
version = "2.0.0"
description = "Python SDK for the NexusWeb3 v2 agent protocol contracts"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "NexusWeb3"}]
keywords = ["ethereum", "web3", "agents", "escrow", "base"]
dependencies = [
    "web3>=7,<9",
    "eth-account>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nexusweb3 = "nexusweb3.cli:main"

[tool.setuptools]
packages = ["nexusweb3", "nexusweb3.contracts"]

[tool.setuptools.package-data]
nexusweb3 = ["abis/*.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
